[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adp-slicer"
version = "0.1.0"
description = "Adaptive Detail Printing slicer prototype for fine outer walls and coarse backing walls."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
adp-slicer = "adp_slicer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
